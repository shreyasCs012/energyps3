[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "energysense-twin"
version = "0.1.0"
description = "Offline-first synthetic industrial energy digital twin prototype"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "pydantic>=2.6",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.3"]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27"]

[tool.setuptools.packages.find]
include = ["contracts*", "plant*", "twin*", "policies*", "analytics*", "cv*", "renderer*", "replay*", "genai*", "api*", "eval*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

